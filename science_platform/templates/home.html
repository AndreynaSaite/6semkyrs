{% extends 'base.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="{% static 'css/home.css' %}">

<div class="page">

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            ScienceHub
        </div>

        <!-- SEARCH -->
        <input
            type="text"
            id="searchInput"
            placeholder="Search by title, keywords, content..."
        >

        <!-- ACTIONS -->
        <div class="actions">
            <button onclick="openCreateModal()">+ Create</button>
            <button onclick="openProfile()">👤 Profile</button>
        </div>

    </header>

    <!-- ALL ARTICLES -->
    <main id="articlesContainer"></main>

</div>


<!-- ================= CREATE ARTICLE ================= -->

<div class="modal hidden" id="createModal">

    <div class="modal-box">

        <h2>Create Article</h2>

        <input
            type="text"
            id="title"
            placeholder="Article title"
        >

        <input
            type="text"
            id="category"
            placeholder="Category"
        >

        <input
            type="text"
            id="keywords"
            placeholder="Keywords (comma separated)"
        >

        <textarea
            id="content"
            placeholder="Write article content..."
        ></textarea>

        <input
            type="file"
            id="pdf"
            accept=".pdf"
        >

        <div class="actions-row">
            <button onclick="createArticle()">Publish</button>
            <button onclick="closeCreateModal()">Close</button>
        </div>

    </div>

</div>


<!-- ================= PROFILE ================= -->

<div class="modal hidden" id="profileModal">

    <div class="modal-box">

        <h2>My Profile</h2>

        <!-- USER DATA -->
        <div id="profileInfo"></div>

        <h3>My Articles</h3>

        <!-- MY ARTICLES -->
        <div id="myArticles"></div>

        <div class="actions-row">
            <button onclick="logout()">Logout</button>
            <button onclick="closeProfile()">Close</button>
        </div>

    </div>

</div>


<!-- ================= ARTICLE DETAILS ================= -->

<div class="modal hidden" id="articleModal">

    <div class="modal-box large">

        <!-- ARTICLE INFO -->
        <div id="articleView"></div>

        <hr>

        <!-- REVIEWS -->
        <h3>Reviews</h3>

        <div id="reviews"></div>

        <hr>

        <!-- ADD REVIEW -->
        <h3>Leave Review</h3>

        <textarea
            id="reviewText"
            placeholder="Write your review..."
        ></textarea>

        <input
            type="number"
            id="rating"
            min="1"
            max="5"
            value="5"
        >

        <div class="actions-row">
            <button onclick="sendReview()">Send Review</button>
            <button onclick="closeArticle()">Close</button>
        </div>

    </div>

</div>

<script src="/static/js/home.js"></script>
{% endblock %}
